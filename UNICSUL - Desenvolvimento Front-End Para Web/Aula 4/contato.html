    <main class="content">
        <h2>Fale conosco</h2>
        <p>Preencha o formulário abaixo. Este exemplo é apenas visual e não envia os dados a um servidor.</p>
        <form action="#" method="post" onsubmit="alert('Exemplo: formulário preenchido!'); return false;">
            <p><label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required></p>
            <p><label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required></p>
            <p><label for="mensagem">Mensagem:</label><br>
            <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem" required></textarea></p>
            <button type="submit">Enviar</button>
        </form>
